<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - FitZone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <h1>Fit<span>Zone</span></h1>

        <h2>Admin Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="forgot.html">
            Forgot Password?
        </a>

        <p id="loginMessage"></p>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
