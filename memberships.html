<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Memberships - FitZone</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-body">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            Fit<span>Zone</span>
        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="members.html">
                    👥 Members
                </a>
            </li>

            <li>
                <a href="trainers.html">
                    🏋️ Trainers
                </a>
            </li>

            <li>
                <a href="memberships.html" class="active">
                    💳 Memberships
                </a>
            </li>

            <li>
                <a href="attendance.html">
                    📋 Attendance
                </a>
            </li>

            <li>
                <a href="workouts.html">
                    💪 Workout Plans
                </a>
            </li>

            <li>
                <a href="payments.html">
                    💰 Payments
                </a>
            </li>

            <li>
                <a href="profile.html">
                    👤 Profile
                </a>
            </li>

            <li>
                <a href="settings.html">
                    ⚙️ Settings
                </a>
            </li>

        </ul>

        <button
            onclick="logout()"
            class="sidebar-logout">

            🚪 Logout

        </button>

    </aside>


    <!-- Main Content -->

    <main class="dashboard-main">

        <div class="dashboard-topbar">

            <div>

                <h1>Membership Management</h1>

                <p>
                    Create and manage gym membership plans
                </p>

            </div>

            <button
                class="add-member-btn"
                onclick="openMembershipForm()">

                + Add Plan

            </button>

        </div>


        <!-- Membership Form -->

        <div
            id="membershipFormContainer"
            class="member-form-container">

            <div class="form-header">

                <h2 id="membershipFormTitle">
                    Add Membership Plan
                </h2>

                <button
                    onclick="closeMembershipForm()"
                    class="close-btn">

                    ✕

                </button>

            </div>


            <form id="membershipForm">

                <input
                    type="hidden"
                    id="membershipEditIndex">


                <div class="form-grid">

                    <div>

                        <label>Plan Name</label>

                        <input
                            type="text"
                            id="planName"
                            placeholder="Example: Basic"
                            required>

                    </div>


                    <div>

                        <label>Duration</label>

                        <select
                            id="planDuration"
                            required>

                            <option value="">
                                Select Duration
                            </option>

                            <option value="1 Month">
                                1 Month
                            </option>

                            <option value="3 Months">
                                3 Months
                            </option>

                            <option value="6 Months">
                                6 Months
                            </option>

                            <option value="12 Months">
                                12 Months
                            </option>

                        </select>

                    </div>


                    <div>

                        <label>Price</label>

                        <input
                            type="number"
                            id="planPrice"
                            placeholder="Enter price"
                            min="0"
                            required>

                    </div>


                    <div>

                        <label>Status</label>

                        <select
                            id="planStatus"
                            required>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>


                    <div class="full-width">

                        <label>Features</label>

                        <textarea
                            id="planFeatures"
                            placeholder="Example: Gym Access, Locker, Personal Training"
                            rows="4"
                            required></textarea>

                    </div>

                </div>


                <button
                    type="submit"
                    class="save-member-btn">

                    Save Plan

                </button>

            </form>

        </div>


        <!-- Membership Cards -->

        <div
            id="membershipContainer"
            class="membership-grid">

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
