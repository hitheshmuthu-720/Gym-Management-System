<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - FitZone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <h2>FitZone</h2>
        </div>

        <nav class="sidebar-menu">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="members.html">
                Members
            </a>

            <a href="trainers.html">
                Trainers
            </a>

            <a href="memberships.html">
                Memberships
            </a>

            <a href="attendance.html">
                Attendance
            </a>

            <a href="workouts.html">
                Workout Plans
            </a>

            <a href="payments.html">
                Payments
            </a>

            <a href="profile.html" class="active">
                Profile
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>

        <button
            class="sidebar-logout"
            onclick="logout()"
        >
            Logout
        </button>

    </aside>


    <!-- Main Content -->
    <main class="dashboard-main">

        <div class="dashboard-topbar">

            <div>

                <h1>User Profile</h1>

                <p>
                    Manage your FitZone admin profile
                </p>

            </div>


            <div class="admin-profile">

                <div class="profile-circle">
                    A
                </div>

                <span>
                    Admin
                </span>

            </div>

        </div>


        <!-- Profile Card -->

        <div class="profile-page-grid">


            <!-- Profile Information -->

            <div class="dashboard-panel profile-card">

                <div class="profile-avatar-large">
                    A
                </div>

                <h2 id="profileDisplayName">
                    FitZone Admin
                </h2>

                <p id="profileDisplayEmail">
                    admin@fitzone.com
                </p>

                <span class="profile-role">
                    Administrator
                </span>

            </div>


            <!-- Edit Profile -->

            <div class="dashboard-panel">

                <div class="panel-header">

                    <h2>
                        Edit Profile
                    </h2>

                </div>


                <form id="profileForm">

                    <div class="form-grid">

                        <div>

                            <label for="profileName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="profileName"
                                required
                            >

                        </div>


                        <div>

                            <label for="profileEmail">
                                Email
                            </label>

                            <input
                                type="email"
                                id="profileEmail"
                                required
                            >

                        </div>


                        <div>

                            <label for="profilePhone">
                                Phone
                            </label>

                            <input
                                type="tel"
                                id="profilePhone"
                                placeholder="Enter phone number"
                            >

                        </div>


                        <div>

                            <label for="profileRole">
                                Role
                            </label>

                            <input
                                type="text"
                                id="profileRole"
                                value="Administrator"
                                readonly
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="save-member-btn"
                    >
                        Save Profile
                    </button>

                </form>


                <p
                    id="profileMessage"
                    class="profile-message"
                ></p>

            </div>


        </div>


        <!-- Change Password -->

        <div class="dashboard-panel password-panel">

            <div class="panel-header">

                <h2>
                    Change Password
                </h2>

            </div>


            <form id="passwordForm">

                <div class="form-grid">

                    <div>

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            required
                        >

                    </div>


                    <div>

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            required
                        >

                    </div>


                    <div>

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="save-member-btn"
                >
                    Change Password
                </button>

            </form>


            <p
                id="passwordMessage"
                class="profile-message"
            ></p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
